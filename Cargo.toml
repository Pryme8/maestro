[package]
name = "maestro"
version = "0.1.0"
description = "An agent-centric replacement for the resource manager"
license = "MIT"
edition = "2021"
rust-version = "1.84"
resolver = "3"

[dependencies]
eframe = "0.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
netstat2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk", "network"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
